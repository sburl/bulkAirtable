[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bulkAirtable"
version = "0.1.0"
description = "A Python package for bulk operations with Airtable"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25.0",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
upload = [
    "boto3>=1.20.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
]
ai = [
    "openai>=1.0.0",
]
all = [
    "boto3>=1.20.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/sburl/bulkAirtable"
Repository = "https://github.com/sburl/bulkAirtable"

[tool.pytest.ini_options]
testpaths = ["tests"]
